name: KACE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_klipper_sweep:
        description: Run the complete sweep against the pinned Klipper commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Cancel older runs on the same branch/PR when new commits are pushed.
# Keeps CI queues clean and saves runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ── Stage 1: Syntax check ────────────────────────────────────────────────────
  lint:
    name: Lint (syntax check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"

      - name: Check syntax of all Python files
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" \
            -not -path "./__pycache__/*" \
            -not -path "./.git/*" \
            | sort \
            | xargs python3 -m py_compile
          echo "All Python files passed syntax check."

      - name: Reject developer-local paths
        run: python3 scripts/check_portability.py

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Validate critical shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/bootstrap.sh
          bash -n docker/ci/entrypoint.sh
          shellcheck --severity=warning install.sh scripts/bootstrap.sh docker/ci/entrypoint.sh

  # ── Stage 2: Unit tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Prepare pinned Klipper before both suites
        id: klipper
        run: |
          mkdir -p tests/results/ci-source
          readarray -t klipper_source < <(python3 -c "from tests.klipper_contract import KLIPPER_REPO_URL, KLIPPER_REF; print(KLIPPER_REPO_URL); print(KLIPPER_REF)")
          git init .klipper-contract-source
          git -C .klipper-contract-source remote add origin "${klipper_source[0]}"
          git -C .klipper-contract-source fetch --depth 1 origin "${klipper_source[1]}"
          git -C .klipper-contract-source checkout --detach FETCH_HEAD
          test "$(git -C .klipper-contract-source rev-parse HEAD)" = "${klipper_source[1]}"
          test -z "$(git -C .klipper-contract-source status --porcelain)"
          git rev-parse HEAD > tests/results/ci-source/tested-commit.txt
          git -C .klipper-contract-source rev-parse HEAD > tests/results/ci-source/klipper-commit.txt

      - name: Run unit tests
        shell: bash
        run: python3 tests/run_tests.py --verbose 2>&1 | tee tests/results/ci-source/unittest.log

      # Run both collectors after successful preparation, even if unittest fails.
      # Neither suite uses continue-on-error: failures remain job failures.
      - name: Run complete pytest suite against pinned Klipper
        if: ${{ !cancelled() && steps.klipper.outcome == 'success' }}
        shell: bash
        run: python3 -m pytest tests --ignore=tests/results -q -rs --junitxml=tests/results/ci-source/pytest.xml 2>&1 | tee tests/results/ci-source/pytest.log

      - name: Upload both source suite results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-source-suites-${{ github.sha }}
          path: tests/results/ci-source/
          if-no-files-found: error

  # Stateful loopback lab: real Moonraker HTTP adapter, Power API, udev MCU
  # monitor, firmware strategies, verification, upload, and rollback. It never
  # opens a physical serial device, GPIO, or removable disk.
  simulated-hardware-integration:
    name: Simulated Hardware Integration
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Run deterministic simulated hardware lab
        run: python3 -m unittest tests.integration.test_simulated_firmware_lab -v

  # ── Stage 3: YAML integrity ──────────────────────────────────────────────────
  yaml-integrity:
    name: YAML Integrity Check
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Validate boards.yaml schema and pattern precedence
        run: python3 tests/run_tests.py --yaml-check

  # ── Stage 4: Snapshot regression gate ───────────────────────────────────────
  # Explicitly blocks merge if any snapshot differs from the golden fixture.
  regression-tests:
    name: Snapshot Regression Gate
    runs-on: ubuntu-24.04
    needs: [unit-tests, simulated-hardware-integration, yaml-integrity]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Run snapshot regression tests
        # KACE_UPDATE_SNAPSHOTS must never be set in CI.
        # Any mismatch between generated output and the golden fixture is a
        # hard failure — this is the primary merge protection gate.
        run: |
          unset KACE_UPDATE_SNAPSHOTS
          python3 tests/run_tests.py --verbose
        env:
          KACE_UPDATE_SNAPSHOTS: ""

      - name: Validate golden configs with pinned Klipper
        run: python3 tests/regression/validate_snapshots.py

      - name: Validate reviewed TMC sockets with pinned Klipper
        run: python3 -m tests.regression.validate_tmc_sockets --artifacts tests/results/tmc-socket-validation

      - name: Upload TMC socket validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-tmc-socket-validation
          path: tests/results/tmc-socket-validation/

      - name: Upload snapshot validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-snapshot-klipper-validation
          path: tests/results/snapshot-validation/

  # Reduced deterministic KACE -> pinned Klipper loader matrix for PRs.
  config-matrix-quick:
    name: KACE / Klipper Config Matrix (quick)
    runs-on: ubuntu-24.04
    needs: regression-tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install KACE dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Run quick pinned-Klipper matrix
        run: python3 tests/matrix/run_matrix.py --profile quick

      - name: Upload matrix reports and generated configs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-klipper-matrix-quick
          path: tests/matrix/artifacts/

  # Keep the existing required-check identity and triggers. The reviewed contract
  # retains raw observations and proves every supported scenario or concrete boundary.
  full-klipper-sweep:
    name: Full Klipper Config Sweep (192+ configs)
    runs-on: ubuntu-24.04
    needs: regression-tests
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.full_klipper_sweep)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Prepare pinned Klipper scenario sources
        run: |
          readarray -t klipper_source < <(python3 -c "from tests.klipper_contract import KLIPPER_REPO_URL, KLIPPER_REF; print(KLIPPER_REPO_URL); print(KLIPPER_REF)")
          git init .klipper-contract-source
          git -C .klipper-contract-source remote add origin "${klipper_source[0]}"
          git -C .klipper-contract-source fetch --depth 1 origin "${klipper_source[1]}"
          git -C .klipper-contract-source checkout --detach FETCH_HEAD
          test "$(git -C .klipper-contract-source rev-parse HEAD)" = "${klipper_source[1]}"

      - name: Run complete reviewed Klipper scenario contract
        run: python3 -m tests.sweep.scenario_contract --artifacts tests/results/reviewed-scenarios

      - name: Upload full sweep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-klipper-full-sweep
          path: tests/results/reviewed-scenarios/
          if-no-files-found: error

  # Full pairwise matrix: manual/pre-release, every boards.yaml board contract.
  config-matrix-full:
    name: KACE / Klipper Config Matrix (full)
    runs-on: ubuntu-24.04
    needs: regression-tests
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install KACE dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Run full pinned-Klipper matrix
        run: python3 tests/matrix/run_matrix.py --profile full

      - name: Upload matrix reports and generated configs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-klipper-matrix-full
          path: tests/matrix/artifacts/

  # ── Stage 6: Docker LPC1769 Firmware Build ───────────────────────────────────
  docker-firmware-build:
    name: Docker MCU Firmware Builds (LPC1769, STM32, RP2040, AVR)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker validation image
        run: |
          docker build -f docker/ci/Dockerfile -t kace-dev .

      # Independent of the candidate/snapshot gate; both remain required checks.
      - name: Run all seven real-build tests and require zero skips
        shell: bash
        env:
          KACE_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tests/results/ci-real-builds
          docker image inspect kace-dev > tests/results/ci-real-builds/container-image.json
          docker run --rm -e KACE_CI_HEAD_SHA -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}:/workspace" kace-dev \
            python3 docker/ci/run_real_builds.py --artifacts tests/results/ci-real-builds \
            2>&1 | tee tests/results/ci-real-builds/builds.log

      - name: Upload real firmware and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kace-real-firmware-builds-${{ github.sha }}
          path: tests/results/ci-real-builds/
          if-no-files-found: error
