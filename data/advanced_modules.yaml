# ============================================================
#  KACE — Advanced Module Passthrough Database
#  data/advanced_modules.yaml
#
#  Defines sections KACE cannot actively configure but can parse
#  and re-emit as commented-out passthrough blocks in the
#  generated printer.cfg.
#
#  Philosophy: parse → emit (commented) → inform → PASS.
#  No section listed here is ever written as active config.
#  Commented data is a reference, not a complete configuration to activate.
#
#  Fields per entry:
#    section_prefix : Klipper section name prefix (lowercase).
#                     Matched against the exact section type before any name.
#    passthrough    : true  → emit an inactive reference; does not imply upstream support
#                     false → keep as UNSUPPORTED gate (no change)
#    upstream_section: false → no native section; UNSUPPORTED even if preserved
#    banner         : human-readable label for the comment header
#    note           : one-line note shown above the commented block
#    translations   : localized banner and note for generated comments
#    fields         : ordered field names to emit. Use ["*"] to emit all.
# ============================================================

advanced_modules:

  # ── Neopixel / WS2812 LED strips ─────────────────────────────
  - section_prefix: neopixel
    passthrough: true
    banner: "Neopixel / WS2812 LED"
    note: >
      Reference only. Neopixel fields preserved as comments.
      A manual configuration requires verified module wiring, pin, chain_count,
      color_order and any dependent sections; this block is not validated for activation.
    translations:
      Español:
        banner: "LED Neopixel / WS2812"
        note: >
          Solo como referencia. Los campos de Neopixel se conservan como comentarios.
          Para configurarlo a mano, verifica el cableado del módulo, pin, chain_count,
          color_order y las secciones dependientes. Este bloque no está validado para su activación.
      Português:
        banner: "LED Neopixel / WS2812"
        note: >
          Apenas para referência. Os campos de Neopixel são mantidos como comentários.
          Para configurar o módulo manualmente, verifique a ligação elétrica, pin, chain_count,
          color_order e as seções dependentes. Este bloco não foi validado para ativação.
    fields:
      - pin
      - chain_count
      - color_order
      - initial_red
      - initial_green
      - initial_blue
      - initial_white
      - "*"

  # ── DotStar / APA102 LED strips ──────────────────────────────
  - section_prefix: dotstar
    passthrough: true
    banner: "DotStar / APA102 LED"
    note: >
      Reference only. DotStar fields preserved as comments.
      A manual configuration requires verified wiring, data_pin, clock_pin,
      chain_count and dependent sections; this block is not validated for activation.
    translations:
      Español:
        banner: "LED DotStar / APA102"
        note: >
          Solo como referencia. Los campos de DotStar se conservan como comentarios.
          Para configurarlo a mano, verifica el cableado, data_pin, clock_pin, chain_count
          y las secciones dependientes. Este bloque no está validado para su activación.
      Português:
        banner: "LED DotStar / APA102"
        note: >
          Apenas para referência. Os campos de DotStar são mantidos como comentários.
          Para configurar o módulo manualmente, verifique a ligação elétrica, data_pin, clock_pin,
          chain_count e as seções dependentes. Este bloco não foi validado para ativação.
    fields:
      - data_pin
      - clock_pin
      - chain_count
      - initial_red
      - initial_green
      - initial_blue
      - "*"

  # ── ADXL345 accelerometer ─────────────────────────────────────
  - section_prefix: adxl345
    passthrough: true
    banner: "ADXL345 Accelerometer (Input Shaper)"
    note: >
      Reference only. ADXL345 fields preserved as comments.
      Verify the sensor, MCU and SPI configuration independently. Resonance testing
      requires additional configuration and calibration outside this passthrough.
    translations:
      Español:
        banner: "Acelerómetro ADXL345 (Input Shaper)"
        note: >
          Solo como referencia. Los campos del ADXL345 se conservan como comentarios.
          Verifica por separado el sensor, la MCU y la configuración SPI. La prueba de
          resonancias requiere configuración y calibración adicionales.
      Português:
        banner: "Acelerômetro ADXL345 (Input Shaper)"
        note: >
          Apenas para referência. Os campos do ADXL345 são mantidos como comentários.
          Verifique separadamente o sensor, a MCU e a configuração SPI. O teste de
          ressonância exige configuração e calibração adicionais.
    fields:
      - cs_pin
      - spi_bus
      - spi_software_sclk_pin
      - spi_software_mosi_pin
      - spi_software_miso_pin
      - axes_map
      - "*"

  # ── PCA9685 PWM expander ──────────────────────────────────────
  - section_prefix: pca9685
    passthrough: true
    upstream_section: false
    banner: "PCA9685 - Unsupported Standalone Section"
    note: >
      This is not a valid standalone Klipper section. Do not uncomment.
      Source fields are retained only as an inactive reference. PCA9685 support
      is internal to Replicape; KACE does not convert this block into Replicape.
    translations:
      Español:
        banner: "PCA9685 - Sección independiente no admitida"
        note: >
          Klipper no admite esta sección por sí sola. No la descomentes.
          Los campos de origen se conservan como referencia inactiva. El soporte de
          PCA9685 es interno a Replicape. KACE no convierte este bloque en una sección Replicape.
      Português:
        banner: "PCA9685 - Seção independente sem suporte"
        note: >
          O Klipper não aceita esta seção isoladamente. Não a descomente.
          Os campos de origem são mantidos como referência inativa. O suporte a PCA9685
          é interno ao Replicape. O KACE não converte este bloco em uma seção Replicape.
    fields:
      - i2c_bus
      - i2c_address
      - i2c_mcu
      - cycle_time
      - "*"

  # ── SX1509 GPIO expander ──────────────────────────────────────
  - section_prefix: sx1509
    passthrough: true
    banner: "SX1509 GPIO Expander"
    note: >
      Reference only. SX1509 fields preserved as comments.
      A manual configuration requires verified I2C MCU, bus, address and all
      consuming GPIO sections; this block is not validated for activation.
    translations:
      Español:
        banner: "Expansor GPIO SX1509"
        note: >
          Solo como referencia. Los campos del SX1509 se conservan como comentarios.
          Para configurarlo a mano, verifica la MCU, el bus y la dirección I2C, así como las
          secciones que usan sus pines GPIO. Este bloque no está validado para su activación.
      Português:
        banner: "Expansor GPIO SX1509"
        note: >
          Apenas para referência. Os campos do SX1509 são mantidos como comentários.
          Para configurar o módulo manualmente, verifique a MCU, o barramento e o endereço I2C,
          além das seções que usam seus pinos GPIO. Este bloco não foi validado para ativação.
    fields:
      - i2c_bus
      - i2c_address
      - i2c_mcu
      - "*"

  # ── Sections kept UNSUPPORTED (not promoted) ──────────────────
  - section_prefix: resonance_tester
    passthrough: false
    banner: "Resonance Tester"
    note: "Requires physical accelerometer wiring + calibration."
    fields: ["*"]

  - section_prefix: lis2dw
    passthrough: false
    banner: "LIS2DW Accelerometer"
    note: "Alternative accelerometer — kept as UNSUPPORTED."
    fields: ["*"]

  - section_prefix: mpu9250
    passthrough: false
    banner: "MPU9250 Accelerometer"
    note: "Alternative accelerometer — kept as UNSUPPORTED."
    fields: ["*"]

  - section_prefix: palette2
    passthrough: false
    banner: "Palette 2"
    note: "Exotic multi-filament device — kept as UNSUPPORTED."
    fields: ["*"]
